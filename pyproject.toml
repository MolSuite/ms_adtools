[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms_adtools"
dynamic = ["version"]  # from the git tag, see [tool.setuptools_scm]
description = "AutoDock receptor, flexible-residue and ligand preparation with RDKit and gemmi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/ms_adtools/zinc/LICENSE", "src/ms_adtools/zinc/GPL-2.0", "src/ms_adtools/zinc/NOTICE"]
requires-python = ">=3.12"
authors = [
    { name = "Mario S. Valdés-Tresanco" },
    { name = "Mario E. Valdés-Tresanco" },
]
keywords = ["autodock", "vina", "pdbqt", "docking", "molsuite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=2.0", "gemmi>=0.7", "rdkit>=2024.3"]

[project.urls]
Homepage = "https://github.com/MolSuite/ms_adtools"
Issues = "https://github.com/MolSuite/ms_adtools/issues"

[project.scripts]
ms_adtools = "ms_adtools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools_scm]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ms_adtools.zinc" = ["AD4Zn.dat", "LICENSE", "GPL-2.0", "NOTICE"]
